<!DOCTYPE html>
<html lang="bn">
<head>
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5872845639819009"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V. DOWNLOADER - All in One</title>
    <!-- ✅ Google AdSense Script (আপনার দেওয়া কোড) -->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        :root {
            --bg-dark: #0a0b1a;
            --card-bg: #1a1c33;
            --card-border: #2a2c4e;
            --text-light: #ffffff;
            --text-muted: #8b8ea6;
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --input-bg: #232544;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: var(--bg-dark); 
            background-image: radial-gradient(circle at 50% 0%, #2a2350 0%, var(--bg-dark) 70%); 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            padding: 20px; color: var(--text-light);
        }
        .main-card { width: 100%; max-width: 440px; background: rgba(26, 28, 51, 0.9); backdrop-filter: blur(15px); border: 1px solid var(--card-border); border-radius: 24px; padding: 30px 22px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden; }
        .main-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; text-transform: uppercase; }
        .header h1 .red { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 42, 109, 0.5); }
        .header p { color: var(--text-muted); font-size: 12px; }
        .platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .platform-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 14px 10px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s ease; }
        .platform-btn.active { color: white; border: none; background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); box-shadow: 0 0 15px rgba(255, 42, 109, 0.4); }
        .input-group { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 14px; display: flex; align-items: center; padding: 6px 6px 6px 15px; margin-bottom: 15px; gap: 8px; }
        .input-group input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text-light); font-size: 14px; padding: 8px 0; }
        .input-group input::placeholder { color: var(--text-muted); }
        .paste-btn { background: #2d2f54; color: var(--neon-blue); border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        .download-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); color: white; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
        .download-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .result-area { margin-top: 20px; display: none; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 15px; animation: fadeIn 0.5s ease; }
        .result-area.active { display: block; }
        .video-info { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--card-border); }
        .video-info img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; background: #000; }
        .video-details h4 { font-size: 14px; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-details p { font-size: 12px; color: var(--neon-blue); }
        .quality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .quality-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-light); padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s; }
        .quality-btn:hover { border-color: var(--neon-blue); }
        .quality-btn.locked { background: rgba(255, 42, 109, 0.1); border-color: rgba(255, 42, 109, 0.3); color: var(--text-muted); }
        .quality-btn.locked i { color: var(--neon-pink); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--neon-pink); border-radius: 20px; padding: 25px 20px; text-align: center; max-width: 380px; width: 100%; }
        .modal-content h3 { color: var(--neon-pink); margin-bottom: 10px; font-size: 18px; }
        .modal-content p { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; }
        .ad-box { background: #000; border-radius: 10px; min-height: 220px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: 15px; border: 1px dashed var(--card-border); flex-direction: column; overflow: hidden; padding: 10px; position: relative; }
        .ad-box ins { display: block; width: 100%; }
        .timer-text { font-size: 26px; font-weight: 700; color: var(--neon-blue); margin-bottom: 15px; }
        .close-modal-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue)); color: white; font-weight: 600; cursor: pointer; font-size: 14px; }
        .close-modal-btn:disabled { opacity: 0.5; background: var(--card-border); cursor: not-allowed; }
        .loader { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header">
            <h1><span class="red">VIDEO</span> DOWNLOAD <br><span class="red">ER</span></h1>
            <p>All-in-One Video Downloader</p>
        </div>

        <div class="platform-grid">
            <button class="platform-btn active" data-platform="tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</button>
            <button class="platform-btn" data-platform="facebook"><i class="fa-brands fa-facebook"></i> Facebook</button>
            <button class="platform-btn" data-platform="youtube"><i class="fa-brands fa-youtube"></i> YouTube</button>
            <button class="platform-btn" data-platform="likee"><i class="fa-solid fa-circle-play"></i> Likee</button>
        </div>

        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="ভিডিও লিংক পেস্ট করুন..." autocomplete="off">
            <button class="paste-btn" id="pasteBtn">Paste</button>
        </div>

        <button class="download-btn" id="downloadBtn">Download Video</button>

        <div class="result-area" id="resultArea">
            <div class="video-info">
                <img id="thumbnail" src="https://via.placeholder.com/80" alt="Thumbnail">
                <div class="video-details">
                    <h4 id="videoTitle">ভিডিও টাইটেল...</h4>
                    <p id="videoPlatform">Platform: TikTok</p>
                </div>
            </div>
            <div class="quality-grid" id="qualityGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="adModal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-lock"></i> Premium Quality Locked</h3>
            <p>এই কোয়ালিটিতে ডাউনলোড করতে বিজ্ঞাপনটি দেখুন।</p>
            <div class="ad-box" id="adContainer"></div>
            <div class="timer-text" id="timerText">05s</div>
            <button class="close-modal-btn" id="closeModalBtn" disabled onclick="unlockQuality()">Wait to Unlock...</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        // ====== আপনার FIREBASE কনফিগারেশন ======
        const firebaseConfig = {
            apiKey: "AIzaSyDZsGCzMd3PGjt3wqwMOFnnftOI7TIJg24",
            authDomain: "myovertimebd-77e59.firebaseapp.com",
            databaseURL: "https://myovertimebd-77e59-default-rtdb.firebaseio.com",
            projectId: "myovertimebd-77e59",
            storageBucket: "myovertimebd-77e59.firebasestorage.app",
            messagingSenderId: "872071063236",
            appId: "1:872071063236:web:4a04c4603b74a8eb3c0b91",
            measurementId: "G-BQKZVKHYGM"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const qualities = ['144p', '240p', '360p', '480p', '720p', '1080p'];
        let appSettings = { api: {}, adsEnabled: false, lockedQualities: {}, adTimer: 5, adCodes: {} };
        let selectedPlatform = 'tiktok';
        let currentlyLockedBtn = null;
        let adTimerInterval = null;
        let currentVideoData = null;
        let currentQuality = "";

        const platformBtns = document.querySelectorAll('.platform-btn');
        const videoUrlInput = document.getElementById('videoUrl');
        const pasteBtn = document.getElementById('pasteBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultArea = document.getElementById('resultArea');
        const qualityGrid = document.getElementById('qualityGrid');
        const adModal = document.getElementById('adModal');
        const timerText = document.getElementById('timerText');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const adContainer = document.getElementById('adContainer');

        db.ref('settings').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                appSettings = data;
                if (resultArea.classList.contains('active')) renderQualityButtons();
            }
        });

        platformBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                platformBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPlatform = btn.getAttribute('data-platform');
                videoUrlInput.placeholder = `${selectedPlatform.charAt(0).toUpperCase() + selectedPlatform.slice(1)} ভিডিও লিংক দিন...`;
                resultArea.classList.remove('active');
            });
        });

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                videoUrlInput.value = text;
            } catch (err) { alert('ম্যানুয়ালি পেস্ট করুন'); }
        });

        function extractYouTubeId(url) {
            const regex = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        downloadBtn.addEventListener('click', async () => {
            const url = videoUrlInput.value.trim();
            if (!url) { alert('ভিডিও লিংক দিন!'); return; }
            if (!appSettings.api || !appSettings.api.key) { alert('⚠️ অ্যাডমিন RapidAPI Key সেট করেনি!'); return; }

            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<div class="loader"></div> Fetching...';
            resultArea.classList.remove('active');

            try {
                const platformConfig = appSettings.api[selectedPlatform];
                const apiKey = appSettings.api.key;
                if (!platformConfig || !platformConfig.endpoint) throw new Error("API Config Missing!");

                const apiUrl = new URL(platformConfig.endpoint);
                if (selectedPlatform === 'youtube') {
                    const videoId = extractYouTubeId(url);
                    if (!videoId) throw new Error("সঠিক YouTube লিংক দিন!");
                    apiUrl.searchParams.append('videoId', videoId);
                } else {
                    apiUrl.searchParams.append('url', url);
                }

                const response = await fetch(apiUrl.toString(), {
                    method: 'GET',
                    headers: { 'X-RapidAPI-Key': apiKey, 'X-RapidAPI-Host': platformConfig.host }
                });

                if (!response.ok) throw new Error("API Error! Status: " + response.status);
                const data = await response.json();
                console.log("API Response:", data);
                
                currentVideoData = data;
                document.getElementById('videoTitle').textContent = data.title || data.desc || "Video Title";
                document.getElementById('videoPlatform').textContent = `Platform: ${selectedPlatform.toUpperCase()}`;
                document.getElementById('thumbnail').src = data.thumbnail || data.cover || data.thumb || "https://via.placeholder.com/80";

                renderQualityButtons();
                resultArea.classList.add('active');
            } catch (error) {
                alert(`❌ Error: ${error.message}`);
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = 'Download Video';
            }
        });

        function renderQualityButtons() {
            qualityGrid.innerHTML = '';
            qualities.forEach(q => {
                const isLocked = appSettings.adsEnabled && appSettings.lockedQualities && appSettings.lockedQualities[q];
                const btn = document.createElement('button');
                btn.className = `quality-btn ${isLocked ? 'locked' : ''}`;
                btn.innerHTML = isLocked ? `<i class="fa-solid fa-lock"></i> ${q} (Ad)` : `${q} (HD)`;
                btn.onclick = () => {
                    currentQuality = q;
                    if (isLocked) { currentlyLockedBtn = btn; showAdModal(); } 
                    else { startDownload(q); }
                };
                qualityGrid.appendChild(btn);
            });
        }

        function getRandomAdCode() {
            if (!appSettings.adCodes) return null;
            const adKeys = Object.keys(appSettings.adCodes);
            if (adKeys.length === 0) return null;
            const randomKey = adKeys[Math.floor(Math.random() * adKeys.length)];
            return appSettings.adCodes[randomKey];
        }

        function showAdModal() {
            adModal.classList.add('active');
            let timeLeft = appSettings.adTimer || 5;
            timerText.textContent = `0${timeLeft}s`;
            closeModalBtn.disabled = true;
            closeModalBtn.textContent = "Wait to Unlock...";

            const selectedAd = getRandomAdCode();
            
            if (selectedAd && selectedAd.code) {
                adContainer.innerHTML = selectedAd.code;
                
                // Parse and execute inline scripts, and re-run AdSense push
                const scripts = adContainer.getElementsByTagName('script');
                const newScripts = [];
                for (let i = 0; i < scripts.length; i++) {
                    newScripts.push(scripts[i].text);
                }
                for (let i = 0; i < newScripts.length; i++) {
                    const script = document.createElement('script');
                    script.text = newScripts[i];
                    document.head.appendChild(script).parentNode.removeChild(script);
                }

                // ✅ AdSense needs re-init after dynamic injection
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                } catch (e) {
                    console.warn('AdSense push failed:', e);
                }
            } else {
                adContainer.innerHTML = '<span style="color:#fff; padding:20px; text-align:center;">No Ad Available</span>';
            }

            clearInterval(adTimerInterval);
            adTimerInterval = setInterval(() => {
                timeLeft--;
                timerText.textContent = `0${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(adTimerInterval);
                    timerText.textContent = "00s";
                    closeModalBtn.disabled = false;
                    closeModalBtn.textContent = "Unlock & Download";
                }
            }, 1000);
        }

        function unlockQuality() {
            if (currentlyLockedBtn) {
                currentlyLockedBtn.classList.remove('locked');
                currentlyLockedBtn.innerHTML = `<i class="fa-solid fa-download"></i> ${currentQuality}`;
                currentlyLockedBtn.onclick = () => startDownload(currentQuality);
                adModal.classList.remove('active');
                startDownload(currentQuality);
                currentlyLockedBtn = null;
            }
        }

        async function startDownload(quality) {
            if (!currentVideoData) return;
            logUserInfo(quality);

            let downloadUrl = "";
            const data = currentVideoData;

            if (selectedPlatform === 'tiktok') {
                downloadUrl = data.play || data.wmplay || data.video?.play_addr?.url_list?.[0] || data.data?.play || "";
            } else if (selectedPlatform === 'facebook') {
                downloadUrl = data.medias?.[0]?.url || data.url || data.hd || data.sd || "";
            } else if (selectedPlatform === 'youtube') {
                if (data.formats && Array.isArray(data.formats)) {
                    const match = data.formats.find(f => f.qualityLabel && f.qualityLabel.includes(quality.replace('p',''))) || data.formats[0];
                    downloadUrl = match?.url || "";
                } else {
                    downloadUrl = data.url || data.adaptiveFormats?.[0]?.url || "";
                }
            } else if (selectedPlatform === 'likee') {
                downloadUrl = data.url || data.play_url || data.video_url || "";
            }

            if (downloadUrl) {
                window.open(downloadUrl, '_blank');
            } else {
                alert("ডাউনলোড লিংক পাওয়া যায়নি। API রেসপন্স চেক করুন।");
            }
        }

        async function logUserInfo(quality) {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();

                db.ref('downloads').push({
                    timestamp: Date.now(),
                    ip: ipData.ip || "Unknown",
                    isp: ipData.org || "Unknown ISP",
                    city: ipData.city || "Unknown",
                    country: ipData.country_name || "Unknown",
                    device: navigator.userAgentData ? navigator.userAgentData.platform : navigator.platform,
                    platform: navigator.userAgent,
                    quality: quality
                });
            } catch (error) { console.error("Logging failed:", error); }
        }
    </script>
</body>
</html>
